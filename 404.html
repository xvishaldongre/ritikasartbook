<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#6b5b71; --ink-soft:#8d7d93; --pink:#ffc8dd; --mint:#c7f0db; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    padding:32px; color:var(--ink); font-family:Quicksand,system-ui,sans-serif;
    background:#fffbf5;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(255,200,221,.5), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(205,232,255,.5), transparent 45%),
      radial-gradient(circle at 75% 85%, rgba(199,240,219,.5), transparent 45%);
  }
  .card {
    background:#fff; border:3px dashed var(--pink); border-radius:40px;
    padding:clamp(28px,5vw,56px); max-width:560px;
    box-shadow:0 26px 50px -24px rgba(107,91,113,.45);
  }
  h1 { font-family:"Baloo 2",system-ui,sans-serif; font-size:clamp(2rem,6vw,3rem); margin:0 0 .3em; }
  p { color:var(--ink-soft); font-size:1.05rem; line-height:1.7; }
  a.btn {
    display:inline-block; margin-top:14px; padding:13px 28px; border-radius:999px;
    background:var(--mint); color:var(--ink); font-weight:700; text-decoration:none;
    border:2px solid #fff; box-shadow:0 10px 24px -12px rgba(107,91,113,.5);
    font-family:"Baloo 2",system-ui,sans-serif;
  }
  a.btn:hover { background:#8fd9b6; }
  .art { width:130px; margin:0 auto 6px; }
</style>
</head>
